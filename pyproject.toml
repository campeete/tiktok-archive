[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-archive"
version = "0.3.0"
description = "Local-first multi-source media archive: transcripts, summaries, semantic tagging. Started as tiktok-archive (v1.7.x); v2 adds source plugins, long-form support, HTTP+MCP API, audit-logged agent access."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cameron Peete", email = "cameron@example.invalid" }]
keywords = ["media", "tiktok", "youtube", "transcribe", "whisper", "ollama", "rag", "archive", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "sqlalchemy>=2.0",
  "pyyaml>=6.0",
  "requests>=2.31",
]

[project.scripts]
# Primary command going forward.
media-archive = "media_archive.cli:main"
# Backward-compatible alias for users coming from tiktok-archive v1.7.x.
# Both commands point to the same dispatcher; the CLI is multi-source aware.
tiktok-archive = "media_archive.cli:main"

[project.optional-dependencies]
download = [
  "yt-dlp>=2026.04",
]
web = [
  "flask>=3.0",
]
# Apple Silicon: mlx-whisper. Requires macOS arm64.
analyze-mac = [
  "yt-dlp>=2026.04",
  "flask>=3.0",
  "mlx-whisper>=0.4",
  "torch>=2.1",
  "numba>=0.59",
  "scipy>=1.11",
  "huggingface_hub>=0.20",
]
# CUDA: faster-whisper. For 4070 PC on WSL2 or Windows.
analyze-cuda = [
  "yt-dlp>=2026.04",
  "flask>=3.0",
  "faster-whisper>=1.0",
  "torch>=2.1",
  "huggingface_hub>=0.20",
]
# Cloud durable mirror.
r2 = [
  "boto3>=1.34",
]
# Real-browser fetching for photo posts (TikTok anti-bot bypass).
browser = [
  "playwright>=1.40",
]
# Media artifact extraction: thumbnails (Pillow) + scene-change (PySceneDetect).
media = [
  "Pillow>=10.0",
  "scenedetect>=0.6",
]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"media_archive.core.webapp" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
